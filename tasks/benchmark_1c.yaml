checker: checkers/benchmark_1c.py
task_context: >
  Mock regional-demand world served by a local FastAPI server. Service: regions —
  GET /regions (manifest of 32 region ids + evidence urls, nothing else) and
  GET /regions/{region_id}/evidence ({region_id, normalized_verified_demand (integer units),
  provenance_id (opaque), reporting_period, status}). The allocation denominator is the sum
  of normalized_verified_demand across all 32 regions (a shared denominator). All worker tool
  calls are bash curl requests against the run's world port.
