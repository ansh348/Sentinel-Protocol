# Task benchmark_1c — demand-normalized regional allocation (Phase-1c WIDTH-SCALED).
# BUILD / NOT FROZEN / NOT CONFIRMATORY. D36 width-scaled form: N one-shard worker steps,
# fixed work per worker (ONE shard each), total work grows with N. A single silently-
# mutated shard changes the SHARED denominator T -> all N parallel allocations wasted.
id: benchmark_1c
archetype: demand_allocation
world_rev: 4
# n_regions = forced width N. executor_width (D35) forces N concurrent workers, one per shard.
# N=8/16 use the same one-shard-per-step structure with the first N steps (sliced to n_regions).
n_regions: 32
fan_out: 32
executor_width: 32
goal: >
  Collect verified regional demand from 32 regional evidence ledgers so a downstream
  DETERMINISTIC reducer can compute demand-normalized allocation shares. Each of 32 workers
  reads exactly ONE region's evidence and reports that region's normalized_verified_demand
  and provenance_id. The FINAL AGGREGATE output must be a JSON object of the form
  {"packages": [ {"region_id": "R-0001", "verified_demand": <that region's
  normalized_verified_demand as an integer>, "provenance_id": "<that region's provenance_id>"},
  ... ]} with EXACTLY ONE entry per region (all 32). Do NOT compute the shared total or the
  shares — a deterministic validator computes T = sum of verified_demand over all regions and
  each share = verified_demand / T exactly. Your only job is to faithfully COLLECT every
  region's verified_demand and provenance_id into that packages list. A single wrong or
  missing region demand invalidates every allocation, so completeness and fidelity matter.
